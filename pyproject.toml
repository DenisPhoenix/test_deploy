[project]
name = "django-practice-drf"
version = "0.1.0"
description = ""
authors = [
    { name = "name", email = "email@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "django-filter (>=26.1,<27.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "eventlet (>=0.41.2,<0.42.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)",
    "coverage (>=7.15.4,<8.0.0)",
]

[tool.black]
line-length = 119
target-version = ['py314']
exclude = '''
/(
    \.git
  | __pycache__
  | env
  | venv
  | \.venv
  | migrations
)/
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ".venv"

[tool.coverage.run]
source = ["."]               # Директории для анализа (корень проекта)
omit = [
    "*/migrations/*",        # Игнорировать миграции Django
    "*/settings.py",         # Игнорировать файл настроек
    "*/wsgi.py",
    "*/asgi.py",
    "manage.py",
    "*/tests/*",             # Сами тесты обычно исключают из отчета
]
