[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ".venv"

[flake8]
max-line-length = 119
exclude =
    .git,
    __pycache__,
    env,
    venv,
    .venv,
    migrations

[tool.black]
line-length = 119
target-version = ['py314']
exclude =
    .git,
    __pycache__,
    env,
    venv,
    .venv,
    migrations